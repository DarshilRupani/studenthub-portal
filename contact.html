<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Contact</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>StudentHub</h1>
    <div class="header-controls">
        <button type="button" id="theme-toggle" aria-pressed="false" hidden>Dark mode</button>
        <button type="button" id="menu-toggle" aria-controls="main-navigation" aria-expanded="false" hidden>Menu</button>
    </div>
    <nav id="main-navigation" aria-label="Main navigation">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="index.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="feedback.html">Feedback</a></li>   
      <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact Us</h2>
      <form>
        <div>
          <label for="contact-name">Your Name</label><br>
          <input type="text" id="contact-name" name="name" required>
        </div>
        <div>
          <label for="contact-email">Your Email</label><br>
          <input type="email" id="contact-email" name="email" required>
        </div>
        <div>
          <label for="contact-message">Message</label><br>
          <textarea id="contact-message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
  </footer>

</body>
</html>
