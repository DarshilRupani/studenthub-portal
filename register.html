<body>

  <header>
    <h1>StudentHub</h1>
   <nav aria-label="Main navigation">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>

</nav>
  </header>

  <main>
    <section aria-labelledby="register-heading">
      <h2 id="register-heading">Create Your StudentHub Account</h2>
      <form>
        <div>
          <label for="fullname">Full Name</label><br>
          <input type="text" id="fullname" name="fullname" required>
        </div>
        <div>
          <label for="reg-email">Email address</label><br>
          <input type="email" id="reg-email" name="email" required>
        </div>
        <div>
          <label for="reg-password">Password</label><br>
          <input type="password" id="reg-password" name="password" required>
        </div>
        <div>
          <label for="role">I am a</label><br>
          <select id="role" name="role">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
          </select>
        </div>
        <button type="submit">Register</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
  </footer>

</body>
